<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Lame d’Aurore</title>
<style>
:root{--bg:#f3ead7;--card:#fffaf0;--ink:#2b2118;--mut:#7a6a55;--acc:#9c3b1c;--bd:#d8c7a6;--btn:#efe2c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16110d;--card:#221a13;--ink:#eadfc8;--mut:#a89674;--acc:#e0883e;--bd:#4a3a28;--btn:#2e231a}}
:root[data-theme="dark"]{--bg:#16110d;--card:#221a13;--ink:#eadfc8;--mut:#a89674;--acc:#e0883e;--bd:#4a3a28;--btn:#2e231a}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin:4px 0 12px;text-align:center}
.hud{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.txt{padding:16px 18px 6px}
.txt h2{margin:0 0 8px;font-size:1.25rem}
.txt p{margin:0 0 12px;line-height:1.55}
.ch{padding:10px 18px 18px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--bd);border-radius:8px;padding:11px 14px;text-align:left;cursor:pointer}
button:hover{border-color:var(--acc)}
button[disabled]{opacity:.4;cursor:not-allowed}
.hint{font-size:.8rem;color:var(--mut)}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px}
.sheet summary{cursor:pointer;padding:12px 16px;font-weight:bold;display:flex;justify-content:space-between;gap:8px}
.sheet summary span{font-weight:normal;color:var(--mut);font-size:.9rem}
.sb{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row b{min-width:64px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;min-width:0}
input[type=text]{flex:1}
textarea{width:100%;box-sizing:border-box;min-height:70px;resize:vertical}
.sb button{padding:5px 12px;text-align:center}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--acc)}
.val{min-width:28px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--btn);border:1px solid var(--bd);border-radius:999px;padding:3px 6px 3px 12px;font-size:.9rem}
.chip button{border:0;background:none;padding:0 4px;color:var(--acc)}
.lbl{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.dice{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:104px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:5}
.dice button{padding:0;background:none;border:0;width:72px;height:72px}
.dice svg{width:72px;height:72px}
.dice polygon{fill:var(--btn);stroke:var(--acc);stroke-width:4}
.dice text{fill:var(--ink);font:bold 30px Georgia,serif}
.dice .hint{font-size:.72rem;line-height:1.3}
#dres{font-size:.85rem;font-weight:bold;min-height:2.4em}
@keyframes sp{to{transform:rotate(360deg)}}
.spin svg{animation:sp .5s linear infinite}
@media (max-width:899px){main{padding-bottom:170px}}
@media (min-width:900px){.dice{top:120px;bottom:auto;right:max(24px,calc(50% - 460px))}}
.pic{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 70%}
.rule{font-style:italic;color:var(--mut);border-left:3px solid var(--bd);padding-left:10px}
</style>
</head>
<body>
<main>
<h1>La Lame d’Aurore</h1>
<details class="sheet"><summary>📜 Fiche de personnage <span id="mini"></span></summary><div class="sb">
<div class="row"><input type="text" id="nm" placeholder="Nom du héros" maxlength="24"></div>
<div class="row"><b>❤ PV</b><button id="hm">−</button><span class="val" id="hpv"></span><button id="hpp">+</button><div class="bar"><i id="hb"></i></div></div>
<div class="row"><b>🪙 Or</b><button id="gm">−</button><span class="val" id="gv"></span><button id="gp">+</button></div>
<div class="row"><b>🎲 Modif. global</b><button id="dm">−</button><span class="val" id="dv"></span><button id="dp">+</button></div>
<div><div class="lbl">🎒 Inventaire</div><div class="chips" id="chips"></div><div class="row"><input type="text" id="ni" placeholder="Ajouter un objet…" maxlength="30"><button id="na">Ajouter</button></div></div>
<div><div class="lbl">📝 Notes</div><textarea id="notes" placeholder="Indices, noms, choix à retenir…"></textarea></div>
<div class="hint">Tout est sauvegardé automatiquement dans ce navigateur, même si tu fermes la page.</div>
</div></details>
<div class="card"><div id="art"></div><div class="txt"><h2 id="t"></h2><div id="p"></div></div><div class="ch" id="c"></div></div>
</main>
<aside class="dice" aria-label="Lanceur de dé"><button id="d20" aria-label="Lancer le dé à 20 faces"><svg viewBox="0 0 100 100"><polygon points="50,4 93,28 93,72 50,96 7,72 7,28"/><text id="dface" x="50" y="62" text-anchor="middle">20</text></svg></button><div id="dres">Lancer le D20</div><div class="hint" id="dmod"></div><div class="hint" id="dhist"></div></aside>

const S={
intro:{a:'cave',img:'autel',alt:'Un autel de runes bleues lumineuses dans une cathédrale sombre',init:{hp:10,max:10},t:'Intro',x:[['n','Le réveil est dur, votre crâne semble peser une tonne. Pourtant, il ne vous semble pas avoir fêté quoi que ce soit. Mais, au-delà du mal de tête, il vous semble qu’autre chose vous échappe : votre nom.'],['r','Les textes en italique indiquent des points de règle ou des informations hors RP (hors du jeu).'],['n','Devant vous se trouve un autel. Sa lumière vous éclaire et semble vous réchauffer.'],['r','Si ce n’est pas déjà le cas, fixez vos points de vie à 10 (PV maximum).'],['n','Cette lumière vous attire. Vous n’en avez pas conscience, mais votre main s’approche irrémédiablement des volutes d’aura bleue qui émanent du centre des runes.']],c:[{l:'Toucher les runes de la main',g:'page2'}]},
page2:{a:'cave',t:'À suivre…',x:[['r','Cette page n’est pas encore écrite : envoie la suite de tes notes pour la créer.']],end:1,c:[]},
start:{a:'village',t:'L’aube sur Valbrume',x:'Le village dort encore quand le glas sonne : le dragon Ashgar s’est réveillé dans la montagne. Les anciens murmurent qu’une épée légendaire, la Lame d’Aurore, repose dans les ruines au-delà de la forêt. Tu es le seul à avoir encore le courage de partir.',c:[{l:'Passer à la taverne avant de partir',g:'tavern'},{l:'Filer directement vers la forêt',g:'forest'}]},
tavern:{a:'tavern',t:'La taverne du Corbeau',x:'Un vieux mage encapuchonné t’observe. « Prends ceci, jeune héros », dit-il en te glissant une amulette tiède. « Elle te protégera du feu, une fois. » Il disparaît dans la fumée.',c:[{l:'Prendre l’amulette et partir',g:'forest',it:'Amulette ignifugée'}]},
forest:{a:'forest',t:'La forêt des murmures',x:'Des yeux jaunes brillent entre les troncs. Un loup affamé te barre la route, puis le sentier se sépare : à gauche, des ruines baignées de lune ; à droite, un gouffre fumant.',c:[{l:'Affronter le loup',g:'forest2',pv:-2},{l:'Gravir un arbre pour le contourner',g:'forest2'}]},
forest2:{a:'forest',t:'Le carrefour',x:'Le loup a fui. Deux chemins s’offrent à toi.',c:[{l:'Aller vers les ruines',g:'ruins'},{l:'Descendre vers le gouffre fumant',g:'cave'}]},
ruins:{a:'ruins',t:'Les ruines d’Eldoran',x:'Au centre d’un cercle de pierres, une épée est plantée dans un autel. Des runes s’éveillent à ton approche. Une voix demande : « Que veux-tu protéger ? »',c:[{l:'« Mon village. »',g:'sword',it:'Lame d’Aurore'},{l:'« Ma gloire. »',g:'curse',pv:-3}]},
curse:{a:'ruins',t:'Le prix de l’orgueil',x:'Les runes s’embrasent et te repoussent. Tu te relèves, meurtri, mais l’autel te laisse une seconde chance. Ton cœur change de réponse.',c:[{l:'« Mon village. »',g:'sword',it:'Lame d’Aurore'}]},
sword:{a:'win',t:'La Lame d’Aurore',x:'L’épée s’illumine entre tes mains. Tu sens sa chaleur couler dans tes bras. Le gouffre fumant est à présent la seule voie vers Ashgar.',c:[{l:'Descendre dans le gouffre',g:'cave'}]},
cave:{a:'cave',t:'Le gouffre d’Ashgar',x:'La chaleur est suffocante. Au fond, une immense silhouette respire lentement, couchée sur un lit d’or.',c:[{l:'Combattre le dragon avec la Lame d’Aurore',g:'dragon',need:'Lame d’Aurore',alt:'dead'},{l:'Attaquer à mains nues',g:'dead'},{l:'Remonter en silence vers les ruines',g:'ruins'}]},
dragon:{a:'dragon',t:'Le souffle d’Ashgar',x:'Le dragon se dresse et crache un torrent de flammes. L’amulette chauffe à blanc sur ta poitrine…',c:[{l:'Lever la Lame et charger',g:'victory',need:'Amulette ignifugée',alt:'dead'}]},
victory:{a:'win',t:'Victoire !',x:'La lame frappe juste. Ashgar s’effondre dans un grondement et les cloches de Valbrume sonnent la fin de la nuit. On chantera ton nom pendant mille ans.',end:1,c:[]},
dead:{a:'dead',t:'Ta quête s’achève ici',x:'Les ténèbres t’engloutissent. Mais les héros, dans les légendes, ont toujours le droit de recommencer.',end:1,c:[]}
};
const $=i=>document.getElementById(i);
const KEY='lame_aurore_run2';
const fresh=()=>({name:'',hp:10,max:10,gold:10,mod:0,inv:[],notes:'',scene:'intro'});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r&&Array.isArray(r.inv)?Object.assign(fresh(),r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
let st;
function mini(){$('mini').textContent=(st.name||'Héros')+' · ❤ '+st.hp+' · 🪙 '+st.gold}
function chips(){const c=$('chips');c.innerHTML='';if(!st.inv.length)c.innerHTML='<span class="hint">vide</span>';st.inv.forEach((n,i)=>{const d=document.createElement('span');d.className='chip';d.textContent=n;const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Retirer '+n);x.onclick=()=>{st.inv.splice(i,1);save();chips()};d.appendChild(x);c.appendChild(d)})}
function vals(){$('dv').textContent=(st.mod>0?'+':'')+st.mod;$('dmod').textContent='Modif. '+(st.mod>0?'+':'')+st.mod;$('hpv').textContent=st.hp;$('gv').textContent=st.gold;$('hb').style.width=Math.max(0,Math.min(100,st.hp/st.max*100))+'%';mini()}
function sheet(){
 $('nm').value=st.name;$('notes').value=st.notes;
 const bx=document.createElement('div');
 [].forEach(k=>{const r=document.createElement('div');r.className='row';r.innerHTML='<b>'+k+'</b><button>−</button><span class="val">'+st.s[k]+'</span><button>+</button>';const[m,,p]=r.querySelectorAll('button,span');const v=r.querySelector('.val');m.onclick=()=>{st.s[k]=Math.max(0,st.s[k]-1);v.textContent=st.s[k];save()};p.onclick=()=>{st.s[k]=Math.min(20,st.s[k]+1);v.textContent=st.s[k];save()};bx.appendChild(r)});
 chips();vals();
}
$('nm').oninput=e=>{st.name=e.target.value;save();mini()};

$('notes').oninput=e=>{st.notes=e.target.value;save()};
$('hm').onclick=()=>{st.hp=Math.max(0,st.hp-1);save();vals()};
$('hpp').onclick=()=>{st.hp=Math.min(99,st.hp+1);save();vals()};
$('gm').onclick=()=>{st.gold=Math.max(0,st.gold-1);save();vals()};
$('gp').onclick=()=>{st.gold=Math.min(999,st.gold+1);save();vals()};
function addItem(){const v=$('ni').value.trim();if(v&&!st.inv.includes(v)){st.inv.push(v);save();chips()}$('ni').value=''}

$('dm').onclick=()=>{st.mod=Math.max(-10,st.mod-1);save();vals()};
$('dp').onclick=()=>{st.mod=Math.min(10,st.mod+1);save();vals()};
$('na').onclick=addItem;$('ni').onkeydown=e=>{if(e.key==='Enter')addItem()};
let rolling=false,hist=[];
function roll(){if(rolling)return;rolling=true;const f=$('dface'),b=$('d20');b.classList.add('spin');let n=0;const iv=setInterval(()=>{f.textContent=1+Math.floor(Math.random()*20);if(++n<10)return;clearInterval(iv);const r=1+Math.floor(Math.random()*20),t=r+st.mod;f.textContent=r;$('dres').textContent=r+(st.mod?(st.mod>0?' + ':' − ')+Math.abs(st.mod):'')+' = '+t+(r===20?' ✨ Critique !':r===1?' 💀 Fiasco':'');hist.unshift(t);hist=hist.slice(0,5);$('dhist').textContent='Derniers : '+hist.join(', ');b.classList.remove('spin');rolling=false},60)}
$('d20').onclick=roll;
function art(k){const s=SKY[k]||SKY.village;return `<svg viewBox="0 0 400 200" role="img" aria-label="Illustration"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset="1" stop-color="${s[1]}"/></linearGradient></defs><rect width="400" height="200" fill="url(#g)"/>${SC[k]}</svg>`}
function go(id){
 if(st.hp<=0)id='dead';
 const s=S[id];
 $('art').innerHTML=s.img?`<img class="pic" src="${IMG[s.img]}" alt="${s.alt||''}">`:art(s.a);$('t').textContent=s.t;const pb=$('p');pb.innerHTML='';(Array.isArray(s.x)?s.x:[['n',s.x]]).forEach(([k,tx])=>{const e=document.createElement('p');e.textContent=tx;if(k==='r')e.className='rule';pb.appendChild(e)});
 if(s.init)Object.assign(st,s.init);st.scene=id;save();sheet();
 
 const c=$('c');c.innerHTML='';
 s.c.forEach(o=>{
  const b=document.createElement('button');b.textContent=o.l;
  b.onclick=()=>{
   if(o.pv)st.hp+=o.pv;
   
   if(o.it&&!st.inv.includes(o.it))st.inv.push(o.it);
   let dest=o.g;
   if(o.need&&!st.inv.includes(o.need))dest=o.alt||'dead';
   go(dest);
  };
  c.appendChild(b);
 });
 if(s.end){const b=document.createElement('button');b.textContent='↺ Recommencer l’aventure';b.onclick=()=>{const keep=st.name;st=fresh();st.name=keep;go('intro')};c.appendChild(b)}
}
st=load()||fresh();go(S[st.scene]?st.scene:'intro');
</script>
